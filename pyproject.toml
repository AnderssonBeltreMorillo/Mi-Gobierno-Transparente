[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-gobierno-transparente"
version = "0.1.0"
description = "Backend del demo 'Mi gobierno transparente' (arquitectura Onion)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Equipo Mi gobierno transparente" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-beautifulsoup4>=4.12",
    "types-requests>=2.31",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true

# firebase-admin no publica stubs y google-cloud-firestore se tipa de forma
# dinámica. Los adaptadores aíslan esas dependencias; el resto del proyecto
# sigue verificado en modo estricto.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.*", "bs4.*", "requests.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
