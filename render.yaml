services:
  - type: web
    name: mi-gobierno-transparente
    runtime: python
    buildCommand: bash ./build_render.sh
    startCommand: uvicorn mi_gobierno_transparente.presentation.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ENABLE_BACKGROUND_SYNC
        value: "true"
      - key: DGCP_MAX_PROCESSES
        value: "1"
